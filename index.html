<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root { --font-game: 'Press Start 2P', 'Courier New', monospace; --bg-dark: #05070d; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background: var(--bg-dark); font-family: var(--font-game); color: #f8fafc; display: flex; justify-content: center; align-items: center; }
    #start-screen, #map-screen { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: radial-gradient(circle at 50% 35%, #172038 0%, #05070d 100%); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
    #map-screen.hidden, #start-screen.hidden { display: none; }
    #logo-canvas { width: 96px; height: 96px; image-rendering: pixelated; margin-bottom: 18px; }
    .game-logo-title { font-size: clamp(18px, 5vw, 26px); line-height: 1.4; color: #38bdf8; text-shadow: 3px 3px 0 #0f172a, 5px 5px 0 #0284c7; margin-bottom: 10px; }
    .game-logo-sub { font-size: clamp(8px, 2.5vw, 10px); color: #fbbf24; margin-bottom: 28px; letter-spacing: 1px; }
    .arcade-btn { background: #ef4444; color: #fff; border: 4px solid #fca5a5; box-shadow: 0 6px 0 #7f1d1d, 0 8px 16px rgba(0,0,0,0.8); padding: 14px 22px; font-family: var(--font-game); font-size: clamp(11px, 3vw, 15px); cursor: pointer; }
    .arcade-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7f1d1d; }
    .screen-header { font-size: clamp(12px, 3.5vw, 16px); color: #38bdf8; text-shadow: 2px 2px 0 #000; margin-bottom: 14px; }
    .map-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 520px; }
    .map-card { background: #13192b; border: 3px solid #334155; box-shadow: 0 4px 0 #020408; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .map-card:active { transform: translateY(3px); }
    .map-card canvas { width: 100%; height: 56px; border: 2px solid #020408; image-rendering: pixelated; margin-bottom: 6px; }
    .map-name { font-size: 8px; color: #f8fafc; margin-bottom: 3px; }
    .map-tag { font-size: 6px; color: #94a3b8; text-align: center; }
    #game-container { display: flex; flex-direction: column; width: 100vw; max-width: 600px; height: 100dvh; background: #03050a; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
    #arena-box { position: relative; width: 100%; height: 57dvh; background: #050811; border-bottom: 4px solid #334155; overflow: hidden; }
    #game-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #top-hud { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; gap: 4px; }
    .hud-cluster { display: flex; gap: 4px; pointer-events: auto; }
    .game-btn { background: #1e293b; color: #f8fafc; border: 2px solid #64748b; box-shadow: 0 3px 0 #020408; padding: 5px 6px; font-family: var(--font-game); font-size: 7px; cursor: pointer; }
    .game-btn:active { transform: translateY(2px); }
    .game-btn.on { background: #0284c7; border-color: #7dd3fc; }
    .game-btn.boom { background: #dc2626; border-color: #fca5a5; }
    .game-btn.clear { background: #7f1d1d; border-color: #f87171; }
    #dock-box { display: flex; flex-direction: row; width: 100%; height: 43dvh; background: #0a0e1a; }
    #category-bar { width: 12%; min-width: 48px; height: 100%; background: #05070f; border-right: 3px solid #334155; display: flex; flex-direction: column; }
    .cat-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 2px solid #131a2c; cursor: pointer; padding: 2px; gap: 3px; }
    .cat-btn.active { background: #19233a; border-left: 3px solid #38bdf8; }
    .cat-btn canvas { width: 18px; height: 18px; image-rendering: pixelated; }
    .cat-btn span { font-size: 5px; color: #cbd5e1; text-align: center; }
    #items-grid { width: 88%; height: 100%; padding: 6px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); grid-auto-rows: 62px; gap: 5px; align-content: start; }
    .item-slot { background: #111827; border: 2px solid #334155; box-shadow: 0 2px 0 #020408; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px; cursor: grab; gap: 3px; }
    .item-slot.active { border-color: #38bdf8; background: #1e3a5f; }
    .item-slot canvas { width: 22px; height: 22px; image-rendering: pixelated; pointer-events: none; }
    .item-slot span { font-size: 5px; color: #e2e8f0; text-align: center; pointer-events: none; }
    #drag-ghost { position: fixed; width: 36px; height: 36px; pointer-events: none; z-index: 200; image-rendering: pixelated; display: none; transform: translate(-50%, -50%); }
    #info-bar { position: absolute; bottom: 4px; left: 6px; right: 6px; font-size: 6px; color: #64748b; pointer-events: none; text-align: center; }
  </style>
</head>

<script>
const C = {
  W1:"#78350f",W2:"#b45309",W3:"#d97706", S1:"#334155",S2:"#64748b",S3:"#cbd5e1",
  R1:"#9f1239",R2:"#e11d48",R3:"#fda4af", I1:"#0284c7",I2:"#38bdf8",I3:"#e0f2fe",
  G1:"#b45309",G2:"#f59e0b",G3:"#fef08a", P1:"#581c87",P2:"#9333ea",P3:"#e9d5ff",
  E1:"#065f46",E2:"#10b981",E3:"#6ee7b7", B1:"#7f1d1d",B2:"#dc2626",B3:"#fca5a5",
  BLK:"#090d16",WHT:"#ffffff", ST1:"#44403c",ST2:"#78716c",ST3:"#a8a29e",
  CR1:"#0e7490",CR2:"#22d3ee",CR3:"#cffafe", PL1:"#4c1d95",PL2:"#7c3aed",PL3:"#c4b5fd",
  SK1:"#d4d4d8",SK2:"#a1a1aa",SK3:"#71717a"
};

function drawSprite(ctx, id, size) {
  ctx.clearRect(0,0,size,size);
  const u = size/16;
  const p = (x,y,w,h,col)=>{ ctx.fillStyle=col; ctx.fillRect(Math.floor(x*u),Math.floor(y*u),Math.ceil(w*u),Math.ceil(h*u)); };
  switch(id){
    case"cat_solids":p(2,2,12,12,C.W1);p(3,3,10,10,C.W2);break;
    case"cat_motion":p(6,1,4,14,C.S2);p(1,6,14,4,C.S2);p(4,4,8,8,C.G2);break;
    case"cat_fluids":p(7,2,2,3,C.I3);p(5,5,6,4,C.I2);p(4,9,8,5,C.I1);break;
    case"cat_boom":p(4,5,8,9,C.B2);p(7,2,2,3,C.G2);p(8,1,2,2,C.G3);break;
    case"wood":p(1,1,14,14,C.W1);p(2,2,12,12,C.W2);p(2,5,12,1,C.W1);p(2,9,12,1,C.W1);break;
    case"steel":p(1,1,14,14,C.S1);p(2,2,12,12,C.S2);p(3,3,2,2,C.S3);p(11,3,2,2,C.S3);break;
    case"rubber":p(3,3,10,10,C.R2);p(4,4,3,3,C.R3);p(9,9,3,3,C.R3);break;
    case"ice":p(1,1,14,14,C.I1);p(2,2,12,12,C.I2);p(3,3,5,2,C.I3);p(9,9,4,2,C.I3);break;
    case"anvil":p(2,3,12,4,C.S2);p(5,7,6,4,C.S1);p(2,11,12,3,C.S2);break;
    case"spring":p(2,2,12,2,C.S3);p(4,5,8,2,C.B2);p(4,9,8,2,C.G2);p(6,12,4,2,C.S2);break;
    case"gold":p(1,1,14,14,C.G1);p(2,2,12,12,C.G2);p(4,4,3,3,C.G3);break;
    case"balloon":p(5,1,6,9,C.R2);p(4,3,8,5,C.R2);p(7,10,2,5,C.WHT);break;
    case"glass":p(2,2,12,12,C.I3);p(4,4,8,8,C.I1);p(6,6,4,4,C.I2);break;
    case"brick":p(1,3,14,4,C.B1);p(1,9,14,4,C.B1);p(7,3,1,4,C.BLK);p(4,9,1,4,C.BLK);break;
    case"stone":p(1,1,14,14,C.ST1);p(2,2,12,12,C.ST2);p(4,4,3,3,C.ST3);p(9,8,4,3,C.ST3);break;
    case"concrete":p(1,1,14,14,C.ST1);p(2,2,12,12,C.S1);p(3,3,2,2,C.S2);p(10,8,3,3,C.S2);break;
    case"cloth":p(2,2,12,12,C.P3);p(3,3,10,2,C.P2);p(3,7,10,2,C.P2);p(3,11,10,2,C.P2);break;
    case"paper":p(2,1,12,14,C.WHT);p(3,2,10,1,C.S3);p(3,5,8,1,C.S3);p(3,8,9,1,C.S3);break;
    case"plastic":p(2,2,12,12,C.PL2);p(3,3,10,10,C.PL3);p(5,5,6,6,C.PL1);break;
    case"crystal":p(7,1,2,3,C.CR3);p(5,4,6,3,C.CR2);p(3,7,10,6,C.CR1);p(6,9,4,3,C.CR2);break;
    case"obsidian":p(1,1,14,14,C.BLK);p(2,2,12,12,"#1e1b4b");p(4,4,3,3,C.P2);p(9,9,3,3,C.P1);break;
    case"lead":p(1,1,14,14,"#3f3f46");p(2,2,12,12,"#52525b");p(4,4,3,3,"#71717a");break;
    case"copper":p(1,1,14,14,"#9a3412");p(2,2,12,12,"#c2410c");p(4,4,3,3,"#fdba74");break;
    case"titanium":p(1,1,14,14,"#1e293b");p(2,2,12,12,"#334155");p(3,3,2,2,"#94a3b8");p(11,11,2,2,"#94a3b8");break;
    case"thruster":p(4,2,8,8,C.S2);p(3,10,10,2,C.S1);p(5,12,6,2,C.G2);p(6,13,4,1,C.G3);break;
    case"gear":p(6,1,4,14,C.P2);p(1,6,14,4,C.P2);p(6,6,4,4,C.BLK);p(7,7,2,2,C.G2);break;
    case"antigrav":p(2,11,12,3,C.S2);p(4,9,8,2,C.P2);p(7,2,2,6,C.P3);p(6,4,4,2,C.P2);break;
    case"fan":p(2,2,12,12,C.S1);p(7,3,2,10,C.I2);p(3,7,10,2,C.I2);p(5,5,6,6,C.S2);break;
    case"bumper":p(4,2,8,12,C.G2);p(2,4,12,8,C.B2);p(5,6,6,4,C.G3);break;
    case"conveyor":p(1,5,14,6,C.S1);p(3,7,2,2,C.G2);p(7,7,2,2,C.G2);p(11,7,2,2,C.G2);break;
    case"portal":p(3,2,10,12,C.P2);p(5,4,6,8,C.P3);p(6,6,4,4,C.P1);break;
    case"wheel":p(2,2,12,12,C.S1);p(4,4,8,8,C.S2);p(6,6,4,4,C.BLK);p(7,2,2,2,C.G2);break;
    case"jetpack":p(3,2,10,8,C.S2);p(4,10,3,4,C.B2);p(9,10,3,4,C.B2);p(5,12,2,2,C.G2);p(10,12,2,2,C.G2);break;
    case"propeller":p(7,1,2,14,C.S2);p(2,6,12,4,C.S3);p(5,5,6,6,C.I2);break;
    case"elevator":p(3,1,10,14,C.S1);p(4,2,8,3,C.S2);p(4,11,8,3,C.S2);p(6,6,4,4,C.G2);break;
    case"piston":p(4,1,8,6,C.S2);p(5,7,6,6,C.S1);p(6,13,4,2,C.G2);break;
    case"gyroscope":p(3,3,10,10,C.S2);p(5,5,6,6,C.I2);p(7,7,2,2,C.WHT);break;
    case"rope":p(7,1,2,14,C.W2);p(6,3,4,2,C.W1);p(6,8,4,2,C.W1);p(6,13,4,2,C.W1);break;
    case"human":
      p(6,1,4,4,"#fbbf24");
      p(5,5,6,6,"#3b82f6");
      p(3,6,2,4,"#fbbf24");
      p(11,6,2,4,"#fbbf24");
      p(5,11,2,4,"#1e40af");
      p(9,11,2,4,"#1e40af");
      break;
    case"skeleton":
      p(6,1,4,4,C.SK1);
      p(7,2,1,1,C.BLK);
      p(9,2,1,1,C.BLK);
      p(5,5,6,6,C.SK2);
      p(6,6,1,4,C.BLK);
      p(9,6,1,4,C.BLK);
      p(3,6,2,4,C.SK3);
      p(11,6,2,4,C.SK3);
      p(5,11,2,4,C.SK3);
      p(9,11,2,4,C.SK3);
      break;
    case"water":p(7,2,2,3,C.I3);p(5,5,6,4,C.I2);p(4,9,8,5,C.I1);break;
    case"sand":p(5,6,6,6,C.G2);p(3,9,10,5,C.G1);p(6,7,2,2,C.G3);break;
    case"lava":p(4,4,8,10,C.B2);p(5,6,6,5,C.G2);p(7,7,2,3,C.G3);break;
    case"fire":p(7,1,2,3,C.G3);p(5,4,6,5,C.G2);p(4,9,8,5,C.B2);break;
    case"acid":p(6,2,4,3,C.E3);p(4,5,8,9,C.E2);p(6,8,4,3,C.E1);break;
    case"slime":p(3,6,10,8,C.E2);p(5,4,6,2,C.E2);p(6,8,4,3,C.E3);break;
    case"oil":p(4,5,8,7,C.BLK);p(6,7,4,3,C.S2);p(5,6,6,2,C.S1);break;
    case"steam":p(4,3,3,3,C.S3);p(8,2,3,3,C.S3);p(5,7,4,3,C.I3);p(9,8,3,2,C.I3);break;
    case"plasma":p(5,2,6,4,C.PL3);p(3,6,10,6,C.PL2);p(6,8,4,3,C.PL1);break;
    case"mud":p(3,5,10,9,"#78350f");p(5,7,6,5,"#a16207");p(6,9,4,2,C.W1);break;
    case"nitro":p(4,3,8,10,"#1e3a8a");p(5,5,6,6,"#3b82f6");p(7,7,2,2,C.WHT);break;
    case"cryo":p(4,3,8,10,C.I1);p(5,5,6,6,C.I2);p(6,7,4,3,C.I3);break;
    case"honey":p(4,4,8,10,"#b45309");p(5,6,6,6,"#d97706");p(6,8,4,3,"#fbbf24");break;
    case"tnt":p(2,2,12,12,C.B2);p(2,6,12,4,C.WHT);p(7,0,2,2,C.G3);p(4,3,2,2,C.WHT);break;
    case"c4":p(2,4,12,8,C.E1);p(6,6,4,4,C.B2);p(7,2,2,2,C.G3);break;
    case"nuke":p(5,2,6,11,C.G2);p(4,4,8,7,C.G2);p(6,6,4,3,C.BLK);p(7,3,2,2,C.WHT);break;
    case"mine":p(2,9,12,5,C.S1);p(6,5,4,2,C.B2);p(4,10,8,3,C.S2);break;
    case"saw":p(6,1,4,14,C.S3);p(1,6,14,4,C.S3);p(6,6,4,4,C.B2);break;
    case"blackhole":p(3,3,10,10,C.P2);p(5,5,6,6,C.BLK);p(7,7,2,2,C.P3);break;
    case"magnet":p(3,2,3,11,C.B2);p(10,2,3,11,C.I1);p(4,4,2,2,C.WHT);p(11,4,2,2,C.WHT);break;
    case"dynamite":p(5,1,6,13,C.B2);p(6,2,4,2,C.WHT);p(7,0,2,2,C.G3);p(6,8,4,2,C.WHT);break;
    case"missile":p(6,1,4,12,C.S2);p(5,12,6,3,C.B2);p(7,2,2,2,C.G2);p(6,5,4,2,C.S1);break;
    case"grenade":p(4,3,8,10,C.S1);p(5,4,6,8,C.S2);p(7,1,2,3,C.G2);p(6,6,4,3,C.B2);break;
    case"spike":p(2,10,12,4,C.S1);p(4,4,2,8,C.S3);p(7,2,2,10,C.S3);p(10,5,2,7,C.S3);break;
    case"laser":p(6,1,4,14,C.R2);p(7,2,2,12,C.R3);p(5,6,6,4,C.WHT);break;
    case"emp":p(3,3,10,10,C.I1);p(5,5,6,6,C.I2);p(6,6,4,4,C.WHT);break;
    case"tesla":p(4,2,8,4,C.S2);p(6,6,4,8,C.I2);p(5,10,6,3,C.I3);break;
  }
}

const ITEMS = [

document.getElementById("btn-play-now").addEventListener("click",()=>{ document.getElementById("start-screen").classList.add("hidden"); openMapScreen(); });
function openMapScreen(){
  const screen=document.getElementById("map-screen"); screen.classList.remove("hidden");
  const grid=document.getElementById("map-grid"); grid.innerHTML="";
  MAPS.forEach(m=>{
    const card=document.createElement("div"); card.className="map-card";
    const cv=document.createElement("canvas"); cv.width=110; cv.height=50;
    const pCtx=cv.getContext("2d"); pCtx.fillStyle=m.bg; pCtx.fillRect(0,0,110,50);
    if(m.floor){ pCtx.fillStyle="#334155"; pCtx.fillRect(0,38,110,12); pCtx.fillStyle=m.heat?"#ef4444":"#38bdf8"; pCtx.fillRect(0,38,110,2); }
    if(m.ambientTemp<0){ pCtx.fillStyle="#bae6fd"; for(let i=0;i<6;i++) pCtx.fillRect(8+i*16,20+Math.random()*10,3,3); }
    const title=document.createElement("div"); title.className="map-name"; title.textContent=m.name;
    const tag=document.createElement("div"); tag.className="map-tag"; tag.textContent=m.tag;
    card.appendChild(cv); card.appendChild(title); card.appendChild(tag);
    card.addEventListener("click",()=>{ currentMap=m; screen.classList.add("hidden"); resizeCanvas(); bodies=[]; particles=[]; walls=[]; links=[]; portals=[]; });
    grid.appendChild(card);
  });
}
function renderCategories(){
  const bar=document.getElementById("category-bar"); bar.innerHTML="";
  CATEGORIES.forEach(cat=>{
    const btn=document.createElement("div"); btn.className="cat-btn"+(cat.id===selectedCategory?" active":"");
    const cv=document.createElement("canvas"); cv.width=16; cv.height=16; drawSprite(cv.getContext("2d"),cat.icon,16);
    const lbl=document.createElement("span"); lbl.textContent=cat.label;
    btn.appendChild(cv); btn.appendChild(lbl);
    btn.addEventListener("click",()=>{ selectedCategory=cat.id; renderCategories(); renderItems(); });
    bar.appendChild(btn);
  });
}
function renderItems(){
  const grid=document.getElementById("items-grid"); grid.innerHTML="";
  ITEMS.filter(i=>i.cat===selectedCategory).forEach(item=>{
    const slot=document.createElement("div"); slot.className="item-slot"+(selectedItem.id===item.id?" active":"");
    const cv=document.createElement("canvas"); cv.width=16; cv.height=16; drawSprite(cv.getContext("2d"),item.id,16);
    const lbl=document.createElement("span"); lbl.textContent=item.name;
    slot.appendChild(cv); slot.appendChild(lbl);
    const beginDrag=(cx,cy)=>{ wallMode=false; btnWall.classList.remove("on"); selectedItem=item; renderItems(); if(item.isParticle)return; draggingItem=item; drawSprite(ghostCtx,item.id,16); ghost.style.display="block"; ghost.style.left=cx+"px"; ghost.style.top=cy+"px"; };
    slot.addEventListener("mousedown",e=>beginDrag(e.clientX,e.clientY));
    slot.addEventListener("touchstart",e=>beginDrag(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
    grid.appendChild(slot);
  });
}
window.addEventListener("mousemove",e=>{ if(draggingItem){ ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px"; }});
window.addEventListener("mouseup",e=>{
  if(draggingItem){ const rect=canvas.getBoundingClientRect(); if(e.clientY>=rect.top&&e.clientY<=rect.bottom) spawnItem(draggingItem,e.clientX-rect.left,e.clientY-rect.top); draggingItem=null; ghost.style.display="none"; }
});

function spawnItem(def,x,y){
  if(def.isParticle){
    const count=def.gas?16:(def.viscosity>4?18:26);
    for(let i=0;i<count;i++){
      particles.push({
        type:def.id, x:x+(Math.random()-0.5)*18, y:y+(Math.random()-0.5)*18,
        vx:(Math.random()-0.5)*2.2, vy:(Math.random()-0.5)*1.8,
        life:def.gas?160+Math.random()*90:650+Math.random()*250,
        density:def.density||1, viscosity:def.viscosity||1, heat:def.heat||0,
        heatCapacity:def.heatCapacity||1, corrosive:def.corrosive||0,
        flammable:def.flammable||false, explosiveFluid:def.explosiveFluid||false,
        heatSensitive:def.heatSensitive||0, gas:def.gas||false, sticky:def.sticky||false,
        freeze:def.freeze||false, abrasive:def.abrasive||false, conductive:def.conductive||false,
        fuel:def.fuel||false, fire:def.fire||false, temp:def.heat?200+def.heat*40:(def.freeze?-40:20),
        grounded:false, growSize:2, flicker:Math.random()*Math.PI*2, isFlame:false
      });
    }
    return;
  }
  const size=(def.id==="anvil"||def.id==="blackhole")?38:(def.id==="nuke"||def.id==="concrete"||def.id==="lead")?34:30;
  const b={
    ...def, x:x-size/2, y:y-size/2, w:size, h:size,
    vx:(Math.random()-0.5)*1.2, vy:0, angle:0, av:0, age:0, active:false,
    charred:0, load:0, health:def.health||100, maxHealth:def.health||100,
    temp:currentMap.ambientTemp||22, burning:false, frozen:false, charged:0, springPhase:0,
    inLava:false, isSkeleton:false, walkDir:Math.random()>0.5?1:-1, walkTimer:0
  };
  bodies.push(b);
  if(def.portal){ portals.push(b); if(portals.length>2) portals.shift(); }
  if(def.rope){
    let nearest=null, nd=80;
    bodies.forEach(o=>{ if(o===b)return; const d=Math.hypot((o.x+o.w/2)-(b.x+b.w/2),(o.y+o.h/2)-(b.y+b.h/2)); if(d<nd){nd=d;nearest=o;} });
    if(nearest) links.push({a:b, b:nearest, restLen:nd, strength:0.35});
  }
}

function getPos(e){ const rect=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left,y:t.clientY-rect.top}; }
canvas.addEventListener("mousedown",arenaDown); canvas.addEventListener("touchstart",arenaDown,{passive:false});
function arenaDown(e){
  if(e.cancelable)e.preventDefault(); const pos=getPos(e); pointer={...pos}; prevPointer={...pos};
  if(wallMode){ wallStart={...pos}; return; }
  for(let i=bodies.length-1;i>=0;i--){ const b=bodies[i]; if(pos.x>=b.x-8&&pos.x<=b.x+b.w+8&&pos.y>=b.y-8&&pos.y<=b.y+b.h+8){ grabbedBody=b; return; } }
  if(selectedItem){ if(selectedItem.isParticle)isPainting=true; spawnItem(selectedItem,pos.x,pos.y); }
}
window.addEventListener("mousemove",arenaMove); window.addEventListener("touchmove",arenaMove,{passive:false});
function arenaMove(e){ if(!grabbedBody&&!isPainting&&!wallStart)return; if(e.cancelable)e.preventDefault(); const pos=getPos(e); prevPointer={...pointer}; pointer={...pos}; if(isPainting&&selectedItem&&selectedItem.isParticle)spawnItem(selectedItem,pos.x,pos.y); }
window.addEventListener("mouseup",arenaUp); window.addEventListener("touchend",arenaUp);
function arenaUp(){
  if(wallStart){ walls.push({x:Math.min(wallStart.x,pointer.x),y:Math.min(wallStart.y,pointer.y),w:Math.max(12,Math.abs(pointer.x-wallStart.x)),h:Math.max(12,Math.abs(pointer.y-wallStart.y))}); wallStart=null; }
  if(grabbedBody){ grabbedBody.vx=(pointer.x-prevPointer.x)*0.9; grabbedBody.vy=(pointer.y-prevPointer.y)*0.9; const cx=grabbedBody.x+grabbedBody.w/2,cy=grabbedBody.y+grabbedBody.h/2; grabbedBody.av+=((pointer.x-cx)*grabbedBody.vy-(pointer.y-cy)*grabbedBody.vx)*0.0009; grabbedBody=null; }
  isPainting=false;
}

function detonate(bomb){
  const idx=bodies.indexOf(bomb); if(idx===-1)return; bodies.splice(idx,1);
  const cx=bomb.x+bomb.w/2, cy=bomb.y+bomb.h/2, pwr=bomb.power||1.4;
  shake=Math.min(32,Math.floor(15*pwr));
  bodies.forEach(o=>{
    const dx=(o.x+o.w/2)-cx, dy=(o.y+o.h/2)-cy, d=Math.hypot(dx,dy)||1, r=220*pwr;

      if(b.portal&&portals.length===2){ const other=portals[0]===b?portals[1]:portals[0]; bodies.forEach(o=>{ if(o===b||o===other||o.portal)return; const dx=Math.abs((o.x+o.w/2)-(b.x+b.w/2)),dy=Math.abs((o.y+o.h/2)-(b.y+b.h/2)); if(dx<18&&dy<18&&o.age>15){ o.x=other.x+(Math.random()-0.5)*10; o.y=other.y+(Math.random()-0.5)*10; o.vx*=1.1; o.vy*=1.1; o.age=0; } }); }

    }

    if(p.type === "water" || p.type === "lava"){
      for(let j=Math.max(0, i-30); j<i; j++){
        const q = particles[j];
        if((p.type==="water" && q.type==="lava") || (p.type==="lava" && q.type==="water")){
          const dx = p.x - q.x, dy = p.y - q.y;
          if(dx*dx + dy*dy < 100){
            if(p.type === "water"){ p.type = "steam"; p.vy = -2-Math.random()*2; p.life = 40; p.temp = 100; }
            if(q.type === "water"){ q.type = "steam"; q.vy = -2-Math.random()*2; q.life = 40; q.temp = 100; }
            if(p.type === "lava"){ p.type = "sand"; p.vx*=0.5; p.vy*=0.5; p.temp = 100; }
            if(q.type === "lava"){ q.type = "sand"; q.vx*=0.5; q.vy*=0.5; q.temp = 100; }
            break;
          }
        }
      }
    }

    if(frame%2===0){
      for(let j=i+1;j<Math.min(i+12,particles.length);j++){
        const q=particles[j]; if(q.type!==p.type)continue;
        if(q.grounded) continue;
        const dx=q.x-p.x, dy=q.y-p.y, d2=dx*dx+dy*dy;
        if(d2<64&&d2>0.1){ const d=Math.sqrt(d2), f=0.4*(1-d/8); p.vx-=(dx/d)*f; p.vy-=(dy/d)*f; q.vx+=(dx/d)*f; q.vy+=(dy/d)*f; }
      }
    }
    
    // LAVA: Simple slow flow, NO fire particles spawned (no lag!)
    if(p.type==="lava"){
      p.vx *= 0.88;
      p.vy *= 0.88;
      p.vx += (Math.random()-0.5) * 0.2;
      p.vy += currentMap.gravity * 0.3;
    }
    else if(p.type==="plasma"){ p.vx+=(Math.random()-0.5)*2.8; p.vy+=(Math.random()-0.5)*2.2; if(Math.random()<0.22)particles.push({type:"spark",x:p.x,y:p.y,vx:(Math.random()-0.5)*3.5,vy:(Math.random()-0.5)*3.5,life:11,temp:700,grounded:false,growSize:2,flicker:Math.random()*Math.PI*2,isFlame:false}); }
    else if(p.type==="cryo"){ p.vy+=currentMap.gravity*0.7; p.vx*=0.97; }
    else if(p.type!=="ash"){ p.vy+=currentMap.gravity*0.8*(p.density||1)*0.6; }
    
    const visc=(p.viscosity||1)*0.02*fluidDragMul; p.vx*=(1-visc); p.vy*=(1-visc*0.7);
    p.x+=p.vx; p.y+=p.vy;
    
    if(currentMap.floor && p.y > floorY-5){ p.y = floorY-5; p.vy *= -0.12; p.vx += (Math.random()-0.5)*1.5; p.vx *= 0.82; }
    if(p.x<3){p.x=3;p.vx*=-0.35;} if(p.x>canvas.width-6){p.x=canvas.width-6;p.vx*=-0.35;}
    
    for(const b of bodies){
      if(p.x>b.x && p.x<b.x+b.w && p.y>b.y && p.y<b.y+b.h){
        if(p.heat||p.temp){ const pTemp=p.temp||(p.heat?200+p.heat*50:20); const flow=(pTemp-b.temp)*0.06*(b.conductivity||0.5); b.temp+=flow/(b.thermalMass||1.5); }
        
        // LAVA: Simple damage, no fire spawning
        if(p.type==="lava"){ 
          b.inLava = true;
          if(b.flammable) b.burning=true; 
          b.temp+=2.8; 
          b.health -= 1.5;
        }
        
        if(p.freeze||p.type==="cryo"){ b.temp-=3.5; if(b.temp<-10)b.frozen=true; }
        if(p.type==="water"){ 
          if(b.burning){ b.burning=false; b.temp=Math.max(25,b.temp-12); } 
          else b.temp=Math.max(ambient,b.temp-1.5); 
          if(b.temp > 100) p.temp += (b.temp - p.temp) * 0.1;
          if(b.float || b.mass<0.9) b.vy -= 0.4*(p.density||1);
        }
        if(p.corrosive){
          b.health -= p.corrosive * 0.85;
          if(Math.random() < 0.3) particles.push({type:"smoke", x:p.x, y:p.y, vx:(Math.random()-0.5), vy:-1, life:30, temp:50, grounded:false, growSize:2, flicker:Math.random()*Math.PI*2, isFlame:false});
        }
        if(p.abrasive) b.health -= 0.15;
        if(p.sticky){ b.vx*=0.92; b.vy*=0.92; b.av*=0.9; }
        if(p.fuel && b.burning){ for(let k=0;k<5;k++)particles.push({type:"fire",x:p.x+(Math.random()-0.5)*12,y:p.y,vx:(Math.random()-0.5)*0.8,vy:-1-Math.random()*0.5,life:22,temp:350,grounded:false,growSize:2,flicker:Math.random()*Math.PI*2,isFlame:false}); }
        if(p.explosiveFluid && b.temp>(p.heatSensitive||70)){ detonate({x:p.x-12,y:p.y-12,w:24,h:24,power:1.15}); particles.splice(i,1); break; }
        if((p.density||1)>1.3){ b.vx*=0.96; b.vy*=0.96; }
        if(p.conductive && b.metal) b.charged = Math.min(30, (b.charged||0)+4);
      }
    }
  }
}

function renderArena(){
  ctx.save(); if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle=currentMap.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(st=>{ ctx.fillStyle=st.s>1?"#38bdf8":"#475569"; ctx.fillRect(Math.floor(st.x%canvas.width),Math.floor(st.y%canvas.height),st.s,st.s); st.y+=st.v; });
  ctx.fillStyle="rgba(255,255,255,0.022)"; for(let x=0;x<canvas.width;x+=16)ctx.fillRect(x,0,1,canvas.height); for(let y=0;y<canvas.height;y+=16)ctx.fillRect(0,y,canvas.width,1);
  walls.forEach(w=>{ ctx.fillStyle="#334155"; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.fillStyle="#38bdf8"; ctx.fillRect(w.x,w.y,w.w,3); });
  if(currentMap.floor){ const fy=canvas.height-18; ctx.fillStyle="#1e293b"; ctx.fillRect(0,fy,canvas.width,18); ctx.fillStyle=currentMap.heat?"#ef4444":(currentMap.ambientTemp<0?"#7dd3fc":"#38bdf8"); ctx.fillRect(0,fy,canvas.width,3); }
  
  ctx.strokeStyle="#b45309"; ctx.lineWidth=2;
  links.forEach(L=>{ if(bodies.includes(L.a)&&bodies.includes(L.b)){ ctx.beginPath(); ctx.moveTo(L.a.x+L.a.w/2,L.a.y+L.a.h/2); ctx.lineTo(L.b.x+L.b.w/2,L.b.y+L.b.h/2); ctx.stroke(); } });
  
  bodies.forEach(b=>{
    ctx.save(); ctx.translate(Math.floor(b.x+b.w/2),Math.floor(b.y+b.h/2)); if(b.angle)ctx.rotate(b.angle); ctx.translate(-Math.floor(b.w/2),-Math.floor(b.h/2));
    const spriteId = (b.human && b.isSkeleton) ? "skeleton" : b.id;
    drawSprite(ctx,spriteId,Math.floor(b.w));
    
    const maxLoad = b.hardness * 1.5;
    if(b.load > maxLoad * 0.5 || b.health < b.maxHealth * 0.5){
      const stress = Math.min(1, (b.load > maxLoad ? (b.load - maxLoad) / maxLoad : 0) + (1 - b.health / b.maxHealth));
      ctx.fillStyle=`rgba(0,0,0,${stress * 0.7})`; 
      ctx.fillRect(0,0,b.w,b.h);
      if(stress > 0.3) {
        ctx.strokeStyle = "rgba(0,0,0,0.8)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(b.w * 0.2, b.h * 0.2);
        ctx.lineTo(b.w * 0.5, b.h * 0.5);
        ctx.lineTo(b.w * 0.8, b.h * 0.3);
        ctx.stroke();
      }
    }
    
    if(b.charred>0){ ctx.fillStyle=`rgba(0,0,0,${b.charred/108})`; ctx.fillRect(0,0,b.w,b.h); }
    if(b.temp>70){ ctx.fillStyle=`rgba(239,68,68,${Math.min(0.5,(b.temp-70)/140)})`; ctx.fillRect(0,0,b.w,b.h); }
    if(b.frozen){ ctx.fillStyle="rgba(186,230,253,0.35)"; ctx.fillRect(0,0,b.w,b.h); }
    if(b.charged>5){ ctx.fillStyle=`rgba(56,189,248,${Math.min(0.4,b.charged/40)})`; ctx.fillRect(0,0,b.w,b.h); }
    if(b.charged<-5){ ctx.fillStyle="rgba(100,100,100,0.4)"; ctx.fillRect(0,0,b.w,b.h); }
    ctx.restore();
  });
  
  particles.forEach(p=>{
    let color;
    let sz = 4;
    
    if(p.type === "grass"){
      color = (frame + Math.floor(p.x)) % 2 === 0 ? "#22c55e" : "#4ade80";
      sz = Math.max(2, Math.floor(p.growSize || 2));
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y - sz + 2), 2, sz);
      return;
    }
    if(p.type === "leaf"){
      color = (frame + Math.floor(p.x)) % 2 === 0 ? "#166534" : "#15803d";
      sz = Math.max(2, Math.min(6, Math.floor(p.growSize || 2)));
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y - sz/2), sz, Math.max(2, sz-2));
      return;
    }
    if(p.type === "fire"){
      if(p.isFlame){
        // Flame particles: smaller, fade out
        color = Math.sin(p.flicker || 0) > 0 ? "#fbbf24" : "#f97316";
        sz = 3;
      } else {
        // Grounded/base fire: bigger, solid
        color = Math.sin(p.flicker || 0) > 0 ? "#f97316" : "#ef4444";
        sz = 5;
      }
    }
    else if(p.type==="water")color="#38bdf8";
    else if(p.type==="sand")color="#f59e0b";
    else if(p.type==="lava")color=(frame + Math.floor(p.x)) % 3 === 0 ? "#ef4444" : "#f97316";
    else if(p.type==="acid")color="#10b981";
    else if(p.type==="slime")color="#4ade80";
    else if(p.type==="oil")color="#1c1917";
    else if(p.type==="steam"){color="rgba(226,232,240,0.55)";sz=6;}
    else if(p.type==="plasma")color=(frame + Math.floor(p.x)) % 2 === 0 ? "#c084fc" : "#e879f9";
    else if(p.type==="mud")color="#78350f";
    else if(p.type==="nitro")color="#3b82f6";
    else if(p.type==="cryo")color="#7dd3fc";
    else if(p.type==="honey")color="#d97706";
    else if(p.type==="spark"){color="#fef08a";sz=5;}
    else if(p.type==="smoke"){color="rgba(100,116,139,0.6)";sz=6;}
    else if(p.type==="ash")color="rgba(60,60,60,0.8)";
    else color="#ea580c";
    
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), sz, sz);
  });
  
  if(wallStart){ ctx.strokeStyle="#38bdf8"; ctx.lineWidth=2; ctx.strokeRect(Math.min(wallStart.x,pointer.x),Math.min(wallStart.y,pointer.y),Math.abs(pointer.x-wallStart.x),Math.abs(pointer.y-wallStart.y)); }
  ctx.restore();
}

function loop(){ stepPhysics(); renderArena(); requestAnimationFrame(loop); }
renderCategories(); renderItems(); loop();
</script>
