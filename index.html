<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PIXEL CHAOS // PHYSICS SANDBOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-game: 'Press Start 2P', 'Courier New', monospace;
      --bg-dark: #05070d;
      --panel-bg: #0d121f;
      --border-light: #475569;
      --border-dark: #020408;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warn: #f59e0b;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: var(--font-game);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ================= START & MAP OVERLAYS ================= */
    #start-screen, #map-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at 50% 35%, #172038 0%, #05070d 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    #map-screen.hidden, #start-screen.hidden {
      display: none;
    }

    #logo-canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      margin-bottom: 18px;
    }

    .game-logo-title {
      font-size: clamp(18px, 5vw, 26px);
      line-height: 1.4;
      color: #38bdf8;
      text-shadow: 3px 3px 0px #0f172a, 5px 5px 0px #0284c7;
      margin-bottom: 10px;
    }

    .game-logo-sub {
      font-size: clamp(8px, 2.5vw, 10px);
      color: #fbbf24;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .arcade-btn {
      background: #ef4444;
      color: #ffffff;
      border: 4px solid #fca5a5;
      box-shadow: 0 6px 0 #7f1d1d, 0 8px 16px rgba(0,0,0,0.8);
      padding: 14px 22px;
      font-family: var(--font-game);
      font-size: clamp(11px, 3vw, 15px);
      cursor: pointer;
    }

    .arcade-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #7f1d1d;
    }

    .screen-header {
      font-size: clamp(12px, 3.5vw, 16px);
      color: #38bdf8;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 14px;
    }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }

    .map-card {
      background: #13192b;
      border: 3px solid #334155;
      box-shadow: 0 4px 0 #020408;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .map-card:active {
      transform: translateY(3px);
    }

    .map-card canvas {
      width: 100%;
      height: 56px;
      border: 2px solid #020408;
      image-rendering: pixelated;
      margin-bottom: 6px;
    }

    .map-name { font-size: 8px; color: #f8fafc; margin-bottom: 3px; }
    .map-tag { font-size: 6px; color: #94a3b8; text-align: center; }

    /* ================= MAIN GAME LAYOUT ================= */
    #game-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      max-width: 600px;
      height: 100dvh;
      background: #03050a;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }

    /* TOP 60%: ARENA */
    #arena-box {
      position: relative;
      width: 100%;
      height: 60dvh;
      background: #050811;
      border-bottom: 4px solid #334155;
      overflow: hidden;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    #top-hud {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      gap: 4px;
    }

    .hud-cluster {
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }

    .game-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 2px solid #64748b;
      box-shadow: 0 3px 0 #020408;
      padding: 5px 6px;
      font-family: var(--font-game);
      font-size: 7px;
      cursor: pointer;
    }

    .game-btn:active { transform: translateY(2px); }
    .game-btn.on { background: #0284c7; border-color: #7dd3fc; }
    .game-btn.boom { background: #dc2626; border-color: #fca5a5; }
    .game-btn.clear { background: #7f1d1d; border-color: #f87171; }

    /* BOTTOM 40%: DOCK */
    #dock-box {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 40dvh;
      background: #0a0e1a;
    }

    #category-bar {
      width: 12%;
      min-width: 48px;
      height: 100%;
      background: #05070f;
      border-right: 3px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .cat-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #131a2c;
      cursor: pointer;
      padding: 2px;
      gap: 3px;
    }

    .cat-btn.active {
      background: #19233a;
      border-left: 3px solid #38bdf8;
    }

    .cat-btn canvas { width: 18px; height: 18px; image-rendering: pixelated; }
    .cat-btn span { font-size: 5px; color: #cbd5e1; text-align: center; }

    #items-grid {
      width: 88%;
      height: 100%;
      padding: 6px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      grid-auto-rows: 68px;
      gap: 5px;
      align-content: start;
    }

    .item-slot {
      background: #111827;
      border: 2px solid #334155;
      box-shadow: 0 2px 0 #020408;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3px;
      cursor: grab;
      gap: 3px;
    }

    .item-slot.active { border-color: #38bdf8; background: #1e3a5f; }
    .item-slot canvas { width: 26px; height: 26px; image-rendering: pixelated; pointer-events: none; }
    .item-slot span { font-size: 5px; color: #e2e8f0; text-align: center; pointer-events: none; }

    #drag-ghost {
      position: fixed;
      width: 36px;
      height: 36px;
      pointer-events: none;
      z-index: 200;
      image-rendering: pixelated;
      display: none;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <canvas id="logo-canvas" width="16" height="16"></canvas>
    <div class="game-logo-title">PIXEL CHAOS<br>SANDBOX v5.1</div>
    <div class="game-logo-sub">THERMAL LAVA & DESTRUCTION</div>
    <button class="arcade-btn" id="btn-play-now">PRESS START</button>
  </div>

  <div id="map-screen" class="hidden">
    <div class="screen-header">SELECT WORLD</div>
    <div class="map-grid" id="map-grid"></div>
  </div>

  <div id="game-container">
    <div id="arena-box">
      <canvas id="game-canvas"></canvas>
      <div id="top-hud">
        <div class="hud-cluster">
          <button class="game-btn" id="btn-maps">MAP</button>
          <button class="game-btn on" id="btn-pause">RUN</button>
          <button class="game-btn" id="btn-wall">WALL</button>
        </div>
        <div class="hud-cluster">
          <button class="game-btn boom" id="btn-chaos">BOOM</button>
          <button class="game-btn clear" id="btn-clear">CLR</button>
        </div>
      </div>
    </div>

    <div id="dock-box">
      <div id="category-bar"></div>
      <div id="items-grid"></div>
    </div>
  </div>

  <canvas id="drag-ghost" width="16" height="16"></canvas>

  <script>
    const C = {
      W1: "#78350f", W2: "#b45309", W3: "#d97706",
      S1: "#334155", S2: "#64748b", S3: "#cbd5e1",
      R1: "#9f1239", R2: "#e11d48", R3: "#fda4af",
      I1: "#0284c7", I2: "#38bdf8", I3: "#e0f2fe",
      G1: "#b45309", G2: "#f59e0b", G3: "#fef08a",
      P1: "#581c87", P2: "#9333ea", P3: "#e9d5ff",
      E1: "#065f46", E2: "#10b981", E3: "#6ee7b7",
      B1: "#7f1d1d", B2: "#dc2626", B3: "#fca5a5",
      BLK: "#090d16", WHT: "#ffffff"
    };

    function drawSprite(ctx, id, size) {
      ctx.clearRect(0, 0, size, size);
      const u = size / 16;
      const p = (x, y, w, h, col) => {
        ctx.fillStyle = col;
        ctx.fillRect(Math.floor(x * u), Math.floor(y * u), Math.ceil(w * u), Math.ceil(h * u));
      };

      switch (id) {
        case "cat_solids": p(2,2,12,12,C.W1); p(3,3,10,10,C.W2); break;
        case "cat_motion": p(6,1,4,14,C.S2); p(1,6,14,4,C.S2); p(4,4,8,8,C.G2); break;
        case "cat_fluids": p(7,2,2,3,C.I3); p(5,5,6,4,C.I2); p(4,9,8,5,C.I1); break;
        case "cat_boom":   p(4,5,8,9,C.B2); p(7,2,2,3,C.G2); p(8,1,2,2,C.G3); break;

        case "wood": p(1,1,14,14,C.W1); p(2,2,12,12,C.W2); p(2,5,12,1,C.W1); break;
        case "steel": p(1,1,14,14,C.S1); p(2,2,12,12,C.S2); p(3,3,2,2,C.S3); break;
        case "rubber": p(3,3,10,10,C.R2); p(4,4,3,3,C.R3); break;
        case "ice": p(1,1,14,14,C.I1); p(2,2,12,12,C.I2); p(3,3,5,2,C.I3); break;
        case "anvil": p(2,3,12,4,C.S2); p(5,7,6,4,C.S1); p(2,11,12,3,C.S2); break;
        case "spring": p(2,2,12,2,C.S3); p(4,5,8,2,C.B2); p(4,9,8,2,C.G2); break;
        case "gold": p(1,1,14,14,C.G1); p(2,2,12,12,C.G2); break;
        case "balloon": p(5,1,6,9,C.R2); p(4,3,8,5,C.R2); p(7,10,2,5,C.WHT); break;
        case "glass": p(2,2,12,12,C.I3); p(4,4,8,8,C.I1); break;
        case "brick": p(1,3,14,4,C.B1); p(1,9,14,4,C.B1); p(7,3,1,4,C.BLK); break;

        case "thruster": p(4,2,8,8,C.S2); p(3,10,10,2,C.S1); p(5,12,6,2,C.G2); break;
        case "gear": p(6,1,4,14,C.P2); p(1,6,14,4,C.P2); p(6,6,4,4,C.BLK); break;
        case "antigrav": p(2,11,12,3,C.S2); p(4,9,8,2,C.P2); p(7,2,2,6,C.P3); break;
        case "fan": p(2,2,12,12,C.S1); p(7,3,2,10,C.I2); p(3,7,10,2,C.I2); break;
        case "bumper": p(4,2,8,12,C.G2); p(2,4,12,8,C.B2); break;
        case "conveyor": p(1,5,14,6,C.S1); p(3,7,2,2,C.G2); p(7,7,2,2,C.G2); break;
        case "portal": p(3,2,10,12,C.P2); p(5,4,6,8,C.P3); break;

        case "water": p(7,2,2,3,C.I3); p(5,5,6,4,C.I2); p(4,9,8,5,C.I1); break;
        case "sand": p(5,6,6,6,C.G2); p(3,9,10,5,C.G1); break;
        case "lava": p(4,4,8,10,C.B2); p(5,6,6,5,C.G2); p(7,7,2,3,C.G3); break;
        case "acid": p(6,2,4,3,C.E3); p(4,5,8,9,C.E2); break;
        case "slime": p(3,6,10,8,C.E2); p(5,4,6,2,C.E2); break;
        case "oil": p(4,5,8,7,C.BLK); p(6,7,4,3,C.S2); break;

        case "tnt": p(2,2,12,12,C.B2); p(2,6,12,4,C.WHT); p(7,0,2,2,C.G3); break;
        case "c4": p(2,4,12,8,C.E1); p(6,6,4,4,C.B2); p(7,2,2,2,C.G3); break;
        case "nuke": p(5,2,6,11,C.G2); p(4,4,8,7,C.G2); p(6,6,4,3,C.BLK); break;
        case "mine": p(2,9,12,5,C.S1); p(6,5,4,2,C.B2); break;
        case "saw": p(6,1,4,14,C.S3); p(1,6,14,4,C.S3); p(6,6,4,4,C.B2); break;
        case "blackhole": p(3,3,10,10,C.P2); p(5,5,6,6,C.BLK); break;
        case "magnet": p(3,2,3,11,C.B2); p(10,2,3,11,C.I1); break;
      }
    }

    const MAPS = [
      { id: "blank", name: "BLANK WORLD", tag: "NO FLOOR / DRAW WALLS", gravity: 0.38, drag: 0.994, floor: false, bg: "#03050a" },
      { id: "earth", name: "EARTH LAB", tag: "9.8G / SOLID FLOOR", gravity: 0.42, drag: 0.992, floor: true, bg: "#0d1324" },
      { id: "space", name: "ZERO-G ORBIT", tag: "0.0G / PURE INERTIA", gravity: 0.0, drag: 0.999, floor: false, bg: "#020308" },
      { id: "ocean", name: "DEEP TRENCH", tag: "HIGH DRAG / BUOYANCY", gravity: 0.18, drag: 0.90, floor: true, bg: "#04232c" }
    ];

    const CATEGORIES = [
      { id: "solids", label: "SOLID", icon: "cat_solids" },
      { id: "motion", label: "MOVE",  icon: "cat_motion" },
      { id: "fluids", label: "FLUID", icon: "cat_fluids" },
      { id: "boom",   label: "BOOM",  icon: "cat_boom" }
    ];

    const ITEMS = [
      { id: "wood", cat: "solids", name: "WOOD", mass: 1.0, rest: 0.3, flammable: true },
      { id: "steel", cat: "solids", name: "STEEL", mass: 4.0, rest: 0.1, metal: true },
      { id: "rubber", cat: "solids", name: "RUBBER", mass: 0.8, rest: 0.92 },
      { id: "ice", cat: "solids", name: "ICE", mass: 1.1, rest: 0.2, slippery: true },
      { id: "anvil", cat: "solids", name: "ANVIL", mass: 8.5, rest: 0.05, metal: true },
      { id: "spring", cat: "solids", name: "SPRING", mass: 0.7, rest: 1.25 },
      { id: "gold", cat: "solids", name: "GOLD", mass: 6.5, rest: 0.15, metal: true },
      { id: "balloon", cat: "solids", name: "HELIUM", mass: 0.3, rest: 0.6, float: true },
      { id: "glass", cat: "solids", name: "GLASS", mass: 1.2, rest: 0.4, fragile: true },
      { id: "brick", cat: "solids", name: "BRICK", mass: 3.0, rest: 0.15 },

      { id: "thruster", cat: "motion", name: "ROCKET", mass: 1.4, rest: 0.2, thruster: true },
      { id: "gear", cat: "motion", name: "GEAR", mass: 2.2, rest: 0.4, spinner: true },
      { id: "antigrav", cat: "motion", name: "GRAV-UP", mass: 2.5, rest: 0.2, antigrav: true },
      { id: "fan", cat: "motion", name: "FAN", mass: 1.8, rest: 0.2, fan: true },
      { id: "bumper", cat: "motion", name: "BUMPER", mass: 2.0, rest: 1.45 },
      { id: "conveyor", cat: "motion", name: "BELT", mass: 2.5, rest: 0.1, conveyor: true },
      { id: "portal", cat: "motion", name: "PORTAL", mass: 2.0, portal: true },

      { id: "water", cat: "fluids", name: "WATER", isParticle: true },
      { id: "sand", cat: "fluids", name: "SAND", isParticle: true },
      { id: "lava", cat: "fluids", name: "LAVA", isParticle: true },
      { id: "acid", cat: "fluids", name: "ACID", isParticle: true },
      { id: "slime", cat: "fluids", name: "SLIME", isParticle: true },
      { id: "oil", cat: "fluids", name: "OIL", isParticle: true },

      { id: "tnt", cat: "boom", name: "TNT", mass: 1.2, rest: 0.3, explosive: true, timer: 70, power: 1.2 },
      { id: "c4", cat: "boom", name: "C4", mass: 1.4, rest: 0.2, explosive: true, timer: 50, power: 1.8 },
      { id: "nuke", cat: "boom", name: "NUKE", mass: 4.5, rest: 0.1, explosive: true, timer: 100, power: 3.5 },
      { id: "mine", cat: "boom", name: "MINE", mass: 2.0, rest: 0.1, mine: true, power: 1.5 },
      { id: "saw", cat: "boom", name: "SAW", mass: 2.5, rest: 0.5, saw: true },
      { id: "magnet", cat: "boom", name: "MAGNET", mass: 3.0, rest: 0.2, magnetic: true },
      { id: "blackhole", cat: "boom", name: "VORTEX", mass: 12.0, rest: 0.0, blackhole: true }
    ];

    let currentMap = MAPS[0];
    let selectedCategory = "solids";
    let selectedItem = ITEMS[0];
    let isPaused = false;
    let wallMode = false;
    let bodies = [];
    let particles = [];
    let walls = [];
    let stars = [];
    let shake = 0;

    let grabbedBody = null;
    let pointer = { x: 0, y: 0 };
    let prevPointer = { x: 0, y: 0 };
    let isPainting = false;
    let wallStart = null;
    let draggingItem = null;

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const arenaBox = document.getElementById("arena-box");
    const ghost = document.getElementById("drag-ghost");
    const ghostCtx = ghost.getContext("2d");

    drawSprite(document.getElementById("logo-canvas").getContext("2d"), "tnt", 16);

    function resizeCanvas() {
      canvas.width = arenaBox.clientWidth;
      canvas.height = arenaBox.clientHeight;
      ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener("resize", resizeCanvas);

    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random() * 1000, y: Math.random() * 1000, s: Math.random() > 0.75 ? 2 : 1, v: 0.15 + Math.random() * 0.4 });
    }

    document.getElementById("btn-play-now").addEventListener("click", () => {
      document.getElementById("start-screen").classList.add("hidden");
      openMapScreen();
    });

    function openMapScreen() {
      const screen = document.getElementById("map-screen");
      screen.classList.remove("hidden");
      const grid = document.getElementById("map-grid");
      grid.innerHTML = "";

      MAPS.forEach(m => {
        const card = document.createElement("div");
        card.className = "map-card";
        const cv = document.createElement("canvas");
        cv.width = 110; cv.height = 50;
        const pCtx = cv.getContext("2d");
        pCtx.fillStyle = m.bg; pCtx.fillRect(0, 0, 110, 50);
        if (m.floor) { pCtx.fillStyle = "#334155"; pCtx.fillRect(0, 38, 110, 12); pCtx.fillStyle = "#38bdf8"; pCtx.fillRect(0, 38, 110, 2); }

        const title = document.createElement("div"); title.className = "map-name"; title.textContent = m.name;
        const tag = document.createElement("div"); tag.className = "map-tag"; tag.textContent = m.tag;

        card.appendChild(cv); card.appendChild(title); card.appendChild(tag);
        card.addEventListener("click", () => {
          currentMap = m;
          screen.classList.add("hidden");
          resizeCanvas();
          bodies = []; particles = []; walls = [];
        });
        grid.appendChild(card);
      });
    }

    function renderCategories() {
      const bar = document.getElementById("category-bar");
      bar.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("div");
        btn.className = "cat-btn" + (cat.id === selectedCategory ? " active" : "");
        const cv = document.createElement("canvas"); cv.width = 16; cv.height = 16;
        drawSprite(cv.getContext("2d"), cat.icon, 16);
        const lbl = document.createElement("span"); lbl.textContent = cat.label;
        btn.appendChild(cv); btn.appendChild(lbl);
        btn.addEventListener("click", () => { selectedCategory = cat.id; renderCategories(); renderItems(); });
        bar.appendChild(btn);
      });
    }

    function renderItems() {
      const grid = document.getElementById("items-grid");
      grid.innerHTML = "";
      ITEMS.filter(i => i.cat === selectedCategory).forEach(item => {
        const slot = document.createElement("div");
        slot.className = "item-slot" + (selectedItem.id === item.id ? " active" : "");
        const cv = document.createElement("canvas"); cv.width = 16; cv.height = 16;
        drawSprite(cv.getContext("2d"), item.id, 16);
        const lbl = document.createElement("span"); lbl.textContent = item.name;
        slot.appendChild(cv); slot.appendChild(lbl);

        const beginDrag = (cx, cy) => {
          wallMode = false; btnWall.classList.remove("on");
          selectedItem = item; renderItems();
          if (item.isParticle) return;
          draggingItem = item;
          drawSprite(ghostCtx, item.id, 16);
          ghost.style.display = "block";
          ghost.style.left = cx + "px"; ghost.style.top = cy + "px";
        };
        slot.addEventListener("mousedown", e => beginDrag(e.clientX, e.clientY));
        slot.addEventListener("touchstart", e => beginDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        grid.appendChild(slot);
      });
    }

    window.addEventListener("mousemove", e => { if (draggingItem) { ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; } });
    window.addEventListener("mouseup", e => {
      if (draggingItem) {
        const rect = canvas.getBoundingClientRect();
        if (e.clientY >= rect.top && e.clientY <= rect.bottom) spawnItem(draggingItem, e.clientX - rect.left, e.clientY - rect.top);
        draggingItem = null; ghost.style.display = "none";
      }
    });

    function spawnItem(itemDef, x, y) {
      if (itemDef.isParticle) {
        for (let i = 0; i < 24; i++) {
          particles.push({
            type: itemDef.id,
            x: x + (Math.random() - 0.5) * 18,
            y: y + (Math.random() - 0.5) * 18,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 2,
            life: 650
          });
        }
        return;
      }

      bodies.push({
        ...itemDef,
        x: x - 15, y: y - 15, w: 30, h: 30,
        vx: (Math.random() - 0.5) * 2, vy: 0,
        angle: 0, age: 0, active: false,
        charred: 0, health: 100
      });
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    canvas.addEventListener("mousedown", arenaDown);
    canvas.addEventListener("touchstart", arenaDown, { passive: false });

    function arenaDown(e) {
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      pointer = { ...pos }; prevPointer = { ...pos };

      if (wallMode) { wallStart = { ...pos }; return; }

      for (let i = bodies.length - 1; i >= 0; i--) {
        const b = bodies[i];
        if (pos.x >= b.x - 6 && pos.x <= b.x + b.w + 6 && pos.y >= b.y - 6 && pos.y <= b.y + b.h + 6) {
          grabbedBody = b; return;
        }
      }
      if (selectedItem) {
        if (selectedItem.isParticle) isPainting = true;
        spawnItem(selectedItem, pos.x, pos.y);
      }
    }

    window.addEventListener("mousemove", arenaMove);
    window.addEventListener("touchmove", arenaMove, { passive: false });
    function arenaMove(e) {
      if (!grabbedBody && !isPainting && !wallStart) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      prevPointer = { ...pointer }; pointer = { ...pos };
      if (isPainting && selectedItem && selectedItem.isParticle) spawnItem(selectedItem, pos.x, pos.y);
    }

    window.addEventListener("mouseup", arenaUp);
    window.addEventListener("touchend", arenaUp);
    function arenaUp() {
      if (wallStart) {
        walls.push({ x: Math.min(wallStart.x, pointer.x), y: Math.min(wallStart.y, pointer.y), w: Math.max(10, Math.abs(pointer.x - wallStart.x)), h: Math.max(10, Math.abs(pointer.y - wallStart.y)) });
        wallStart = null;
      }
      if (grabbedBody) {
        grabbedBody.vx = (pointer.x - prevPointer.x) * 0.7;
        grabbedBody.vy = (pointer.y - prevPointer.y) * 0.7;
        grabbedBody = null;
      }
      isPainting = false;
    }

    document.getElementById("btn-maps").addEventListener("click", openMapScreen);
    const btnPause = document.getElementById("btn-pause");
    btnPause.addEventListener("click", () => { isPaused = !isPaused; btnPause.textContent = isPaused ? "STOP" : "RUN"; btnPause.classList.toggle("on", !isPaused); });

    const btnWall = document.getElementById("btn-wall");
    btnWall.addEventListener("click", () => { wallMode = !wallMode; btnWall.classList.toggle("on", wallMode); });

    document.getElementById("btn-clear").addEventListener("click", () => { bodies = []; particles = []; walls = []; });
    document.getElementById("btn-chaos").addEventListener("click", () => {
      spawnItem(ITEMS.find(i => i.id === "nuke"), canvas.width * 0.5, 24);
      [...bodies].forEach(b => { if (b.explosive || b.mine) detonate(b); });
    });

    function detonate(bomb) {
      const idx = bodies.indexOf(bomb);
      if (idx === -1) return;
      bodies.splice(idx, 1);
      const cx = bomb.x + bomb.w / 2, cy = bomb.y + bomb.h / 2;
      const pwr = bomb.power || 1.4;
      shake = Math.min(26, Math.floor(12 * pwr));

      bodies.forEach(other => {
        const dx = (other.x + other.w / 2) - cx, dy = (other.y + other.h / 2) - cy;
        const d = Math.hypot(dx, dy) || 1, r = 200 * pwr;
        if (d < r) {
          const push = ((r - d) / r) * 24 * pwr / Math.sqrt(other.mass || 1);
          other.vx += (dx / d) * push; other.vy += (dy / d) * push - (5 * pwr);
          if (other.flammable) other.burning = true;
          if ((other.explosive || other.mine) && d < r * 0.6) other.age = (other.timer || 50) - 4;
        }
      });

      for (let i = 0; i < 40 * pwr; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 11 * pwr;
        particles.push({ type: Math.random() > 0.3 ? "fire" : "spark", x: cx, y: cy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 25 + Math.random() * 25 });
      }
    }

    function stepPhysics() {
      if (isPaused) return;
      if (shake > 0) shake--;
      const floorY = canvas.height - 18;

      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        b.age++;
        if (b.age > 30) b.active = true;

        if (b === grabbedBody) {
          b.x = pointer.x - b.w / 2; b.y = pointer.y - b.h / 2; b.vx = 0; b.vy = 0; continue;
        }

        let g = currentMap.gravity;
        if (b.float) g = -0.22;
        b.vy += g;

        if (b.active) {
          if (b.thruster) {
            b.vy -= 0.85;
            if (Math.random() < 0.55) particles.push({ type: "fire", x: b.x + b.w/2 + (Math.random()-0.5)*6, y: b.y + b.h + 2, vx: (Math.random()-0.5)*1.5, vy: 3 + Math.random()*2, life: 12 });
          }
          if (b.spinner || b.saw) b.angle += 0.25;
          if (b.antigrav) {
            bodies.forEach(o => { if (o !== b && Math.abs((o.x + o.w/2)-(b.x + b.w/2)) < 40 && o.y < b.y) o.vy -= 0.75; });
          }
          if (b.fan) {
            bodies.forEach(o => { if (o !== b && Math.abs((o.y + o.h/2)-(b.y + b.h/2)) < 42 && o.x > b.x) o.vx += 0.7; });
          }
          if (b.explosive && b.age >= b.timer) { detonate(b); i--; continue; }
        }

        // Lava burning / Charring / Turning black
        if (b.burning) {
          b.charred = Math.min(100, b.charred + 1.2);
          if (b.charred > 85 && Math.random() < 0.08) {
            detonate({ x: b.x, y: b.y, w: b.w, h: b.h, power: 0.8 });
            i--; continue;
          }
          if (Math.random() < 0.35) {
            particles.push({ type: "fire", x: b.x + Math.random() * b.w, y: b.y, vx: (Math.random()-0.5)*1.2, vy: -1.5 - Math.random(), life: 16 });
          }
        }

        b.vx *= currentMap.drag; b.vy *= currentMap.drag;
        b.x += b.vx; b.y += b.vy;

        // Walls
        walls.forEach(w => {
          const ox = Math.min(b.x + b.w, w.x + w.w) - Math.max(b.x, w.x);
          const oy = Math.min(b.y + b.h, w.y + w.h) - Math.max(b.y, w.y);
          if (ox > 0 && oy > 0) {
            if (ox < oy) { b.x += b.x < w.x ? -ox : ox; b.vx = -b.vx * b.rest; }
            else { b.y += b.y < w.y ? -oy : oy; b.vy = -b.vy * b.rest; }
          }
        });

        if (currentMap.floor && b.y + b.h > floorY) {
          b.y = floorY - b.h; b.vy = -b.vy * b.rest; b.vx *= 0.84;
        }
        if (b.x < 0) { b.x = 0; b.vx *= -1; }
        if (b.x + b.w > canvas.width) { b.x = canvas.width - b.w; b.vx *= -1; }
        if (!currentMap.floor && b.y > canvas.height + 100) { bodies.splice(i, 1); i--; }
      }

      // Body-to-Body Collisions
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], b = bodies[j];
          if (!a || !b) continue;
          const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
          const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
          if (ox > 0 && oy > 0) {
            if (a.mine && a.active) { detonate(a); break; }
            if (b.mine && b.active) { detonate(b); break; }
            const tm = a.mass + b.mass, rA = b.mass/tm, rB = a.mass/tm, bounce = Math.max(a.rest, b.rest);
            if (ox < oy) {
              const s = a.x < b.x ? -1 : 1; a.x += s * ox * rA; b.x -= s * ox * rB;
              const rv = a.vx - b.vx; a.vx -= rv * (1 + bounce) * rA; b.vx += rv * (1 + bounce) * rB;
            } else {
              const s = a.y < b.y ? -1 : 1; a.y += s * oy * rA; b.y -= s * oy * rB;
              const rv = a.vy - b.vy; a.vy -= rv * (1 + bounce) * rA; b.vy += rv * (1 + bounce) * rB;
            }
          }
        }
      }

      // Fluids & Lava Movement (Lava shoots fire & bubbles!)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        if (p.type === "fire" || p.type === "spark") {
          p.x += p.vx; p.y += p.vy; continue;
        }

        // Lava fluid boils and shoots fire upward!
        if (p.type === "lava") {
          p.vx += (Math.random() - 0.5) * 1.8;
          p.vy += (Math.random() - 0.5) * 1.2;
          if (Math.random() < 0.12) {
            particles.push({ type: "fire", x: p.x, y: p.y, vx: (Math.random()-0.5)*2, vy: -2 - Math.random()*2, life: 20 });
          }
        }

        p.vy += currentMap.gravity * 0.85;
        p.vx *= 0.95; p.x += p.vx; p.y += p.vy;

        if (currentMap.floor && p.y > floorY - 4) { p.y = floorY - 4; p.vy = 0; p.vx += (Math.random()-0.5)*2; }
        if (p.x < 2) { p.x = 2; p.vx *= -0.5; }
        if (p.x > canvas.width - 6) { p.x = canvas.width - 6; p.vx *= -0.5; }

        // Fluid interactions with blocks
        bodies.forEach(b => {
          if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
            if (p.type === "lava" && b.flammable) b.burning = true;
            if (p.type === "water" && b.burning) b.burning = false;
          }
        });
      }
    }

    function renderArena() {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(st => {
        ctx.fillStyle = st.s > 1 ? "#38bdf8" : "#475569";
        ctx.fillRect(Math.floor(st.x % canvas.width), Math.floor(st.y % canvas.height), st.s, st.s);
        st.y += st.v;
      });

      ctx.fillStyle = "rgba(255,255,255,0.03)";
      for (let x = 0; x < canvas.width; x += 16) ctx.fillRect(x, 0, 1, canvas.height);
      for (let y = 0; y < canvas.height; y += 16) ctx.fillRect(0, y, canvas.width, 1);

      walls.forEach(w => {
        ctx.fillStyle = "#334155"; ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = "#38bdf8"; ctx.fillRect(w.x, w.y, w.w, 3);
      });

      if (currentMap.floor) {
        const fy = canvas.height - 18;
        ctx.fillStyle = "#1e293b"; ctx.fillRect(0, fy, canvas.width, 18);
        ctx.fillStyle = "#38bdf8"; ctx.fillRect(0, fy, canvas.width, 3);
      }

      bodies.forEach(b => {
        ctx.save();
        ctx.translate(Math.floor(b.x + b.w / 2), Math.floor(b.y + b.h / 2));
        if (b.angle) ctx.rotate(b.angle);
        ctx.translate(-Math.floor(b.w / 2), -Math.floor(b.h / 2));
        drawSprite(ctx, b.id, Math.floor(b.w));

        // Render Charred / Blackened overlay if burning!
        if (b.charred > 0) {
          ctx.fillStyle = `rgba(0, 0, 0, ${b.charred / 110})`;
          ctx.fillRect(0, 0, b.w, b.h);
        }
        ctx.restore();
      });

      particles.forEach(p => {
        if (p.type === "water") ctx.fillStyle = "#38bdf8";
        else if (p.type === "sand") ctx.fillStyle = "#f59e0b";
        else if (p.type === "lava") ctx.fillStyle = Math.random() > 0.4 ? "#ef4444" : "#f97316";
        else if (p.type === "acid") ctx.fillStyle = "#10b981";
        else if (p.type === "slime") ctx.fillStyle = "#4ade80";
        else if (p.type === "spark") ctx.fillStyle = "#fef08a";
        else ctx.fillStyle = "#ea580c";

        const sz = (p.type === "fire" || p.type === "spark") ? 5 : 4;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), sz, sz);
      });

      if (wallStart) {
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2;
        ctx.strokeRect(Math.min(wallStart.x, pointer.x), Math.min(wallStart.y, pointer.y), Math.abs(pointer.x - wallStart.x), Math.abs(pointer.y - wallStart.y));
      }

      ctx.restore();
    }

    function loop() {
      stepPhysics();
      renderArena();
      requestAnimationFrame(loop);
    }

    renderCategories();
    renderItems();
    loop();
  </script>
</body>
</html>
